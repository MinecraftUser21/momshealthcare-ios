name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build for iPhone and iPad (simulator)
        run: |
          xcodebuild -version
          xcodebuild -project MomsHealthCare.xcodeproj -scheme MomsHealthCare \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Screenshots on iPhone and iPad simulators
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/MomsHealthCare.app
          BUNDLE=com.momshealthcare.app
          mkdir -p shots
          LIST=$(xcrun simctl list devices available -j)
          IPHONE=$(echo "$LIST" | jq -r '[.devices[][] | select(.name | test("^iPhone [0-9]+( Pro)?$"))] | last | .udid')
          IPAD=$(echo "$LIST" | jq -r '[.devices[][] | select(.name | startswith("iPad Pro"))] | last | .udid')
          echo "iPhone: $IPHONE  iPad: $IPAD"
          shoot() { # device-id name launch-args...
            local id=$1 name=$2; shift 2
            xcrun simctl launch --terminate-running-process "$id" "$BUNDLE" -demo YES "$@" > /dev/null
            sleep 6
            xcrun simctl io "$id" screenshot "shots/$name.png"
          }
          for id in "$IPHONE" "$IPAD"; do
            xcrun simctl boot "$id"
            xcrun simctl bootstatus "$id" -b > /dev/null
            xcrun simctl status_bar "$id" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
            xcrun simctl install "$id" "$APP"
          done
          for tab in home appointments pregnancy clinic; do shoot "$IPHONE" "iphone-$tab" -tab $tab; done
          shoot "$IPHONE" iphone-booking -book YES
          shoot "$IPHONE" iphone-home-light -appearance light
          shoot "$IPAD" ipad-home -tab home
          shoot "$IPAD" ipad-pregnancy -tab pregnancy
          ls -la shots
      - uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: shots

  # An IPA for Sideloadly, AltStore and similar tools, which sign it with the
  # installer's own Apple ID. Tagged builds (v1.2, ...) attach it to the release.
  ipa:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build IPA for sideloading
        run: |
          xcodebuild -project MomsHealthCare.xcodeproj -scheme MomsHealthCare -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MomsHealthCare.app Payload/
          # Ad-hoc signature: the sideloading tool replaces it with the user's own.
          codesign --force --sign - --timestamp=none Payload/MomsHealthCare.app
          codesign --verify --verbose Payload/MomsHealthCare.app
          ditto -c -k --norsrc --keepParent Payload MomsHealthCare.ipa
          unzip -l MomsHealthCare.ipa | head -12
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: MomsHealthCare.ipa
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Mom’s Health Care ${GITHUB_REF_NAME#v} for iPhone and iPad" --notes-file RELEASE_NOTES.md
          gh release upload "$GITHUB_REF_NAME" MomsHealthCare.ipa --clobber
